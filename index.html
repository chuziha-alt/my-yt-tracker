<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YT Editor Workflow Pro - Automation Fixed v7.2</title>
    <!-- 1. 核心框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 2. Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap');
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: #0a0a0a; 
            color: #e2e8f0; 
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        #root { min-height: 100vh; }
        input, select, textarea { font-size: 16px !important; color-scheme: dark; }
        .timer-glow { text-shadow: 0 0 30px currentColor; }
        .mobile-card { background-color: #161616; border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; }
        .btn-active:active { transform: scale(0.96); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .timer-font { font-family: 'JetBrains Mono', monospace; letter-spacing: -0.02em; }
        
        @keyframes alert-pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px 10px rgba(59, 130, 246, 0.3); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .animate-alert { animation: alert-pulse 2s infinite; }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex flex-col items-center justify-center h-screen space-y-4 text-slate-500 text-center px-10">
            <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <div class="font-mono text-xs uppercase tracking-[0.3em] animate-pulse">正在載入肝片大師...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const formatTime = (seconds) => {
            if (!seconds || seconds < 0) return "00:00:00";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        };

        // Timecode 轉換與格式驗證工具 (支援 MM:SS 或 HH:MM:SS)
        const parseTimecodeToSeconds = (tc) => {
            if (!tc || typeof tc !== 'string') return null;
            const parts = tc.trim().split(':').map(p => Number(p));
            if (parts.some(p => isNaN(p) || p < 0)) return null;
            if (parts.length === 2) {
                return parts[0] * 60 + parts[1]; // MM:SS
            } else if (parts.length === 3) {
                return parts[0] * 3600 + parts[1] * 60 + parts[2]; // HH:MM:SS
            }
            return null;
        };

        const Icon = ({ name, size = 20, className = "", color = "currentColor", fill = "none" }) => {
            const icons = {
                "trending-up": <path d="m22 7-8.5 8.5-5-5L2 17M22 7h-6M22 7v6"/>,
                "settings": <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>,
                "play": <polygon points="5 3 19 12 5 21 5 3" fill={fill === "currentColor" ? color : fill}/>,
                "pause": <g><rect x="6" y="4" width="4" height="16" fill={fill === "currentColor" ? color : fill}/><rect x="14" y="4" width="4" height="16" fill={fill === "currentColor" ? color : fill}/></g>,
                "target": <g><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>,
                "plus": <path d="M12 5v14M5 12h14"/>,
                "x": <path d="M18 6 6 18M6 6l12 12"/>,
                "check": <path d="M20 6 9 17l-5-5"/>,
                "edit": <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>,
                "trash-2": <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/>,
                "calendar": <g><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18"/></g>,
                "message-square": <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>,
                "clock": <g><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></g>,
                "heart-pulse": <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />,
                "alert-circle": <g><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></g>,
                "archive": <path d="M21 8v13H3V8M1 3h22v5H1V3m10 8h2"/>,
                "chevron-down": <path d="m6 9 6 6 6-6"/>,
                "chevron-up": <path d="m18 15-6-6-6 6"/>,
                "video": <g><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></g>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const firebaseConfig = {
            apiKey: "AIzaSyAynuyz-WwDnwZaxtxqIzPygctuDw3V-j4",
            authDomain: "yt-editing-tracker.firebaseapp.com",
            projectId: "yt-editing-tracker",
            storageBucket: "yt-editing-tracker.firebasestorage.app",
            messagingSenderId: "1080457874160",
            appId: "1:1080457874160:web:b9118a6f270a8e21955035",
            measurementId: "G-CRDTW9EK2G"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = 'yt-editor-pro-v2';

        const PHASES = [
            { id: 'rough', name: '初剪 A-Roll', color: '#3b82f6' },
            { id: 'subs', name: '效果字及特效', color: '#8b5cf6' },
            { id: 'audio', name: '音樂音效', color: '#10b981' },
            { id: 'grading', name: '調光字幕', color: '#f59e0b' },
            { id: 'upload', name: '縮圖上傳', color: '#ec4899' },
            { id: 'revision', name: '修改', color: '#f43f5e' },
            { id: 'other', name: '其他', color: '#64748b' }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [isAdding, setIsAdding] = useState(false);
            const [syncKey, setSyncKey] = useState(localStorage.getItem('yt_editor_sync_id') || '');
            const [notionUrl, setNotionUrl] = useState(localStorage.getItem('notion_webhook_url') || '');
            const [showSyncModal, setShowSyncModal] = useState(false);
            
            const [projects, setProjects] = useState([]);
            const [logs, setLogs] = useState([]);
            const [now, setNow] = useState(new Date());
            const [expandedMonth, setExpandedMonth] = useState(null);
            const [showBreakAlert, setShowBreakAlert] = useState(false);
            const lastAlertSec = useRef(0);
            const audioCtx = useRef(null);

            const [displaySeconds, setDisplaySeconds] = useState(0); 
            const [activeSession, setActiveSession] = useState(null); 
            const [activeProjectId, setActiveProjectId] = useState('');
            const [activePhase, setActivePhase] = useState(PHASES[0].id);
            const [sessionNote, setSessionNote] = useState('');

            // --- 新增 Timecode 狀態 ---
            const [startTimecode, setStartTimecode] = useState('');
            const [showEndTcModal, setShowEndTcModal] = useState(false);
            const [endTimecode, setEndTimecode] = useState('');
            const [tcWarning, setTcWarning] = useState('');
            
            const [editingIncomeId, setEditingIncomeId] = useState(null);
            const [editingHoursId, setEditingHoursId] = useState(null);
            const [editingDeadlineId, setEditingDeadlineId] = useState(null);
            const [tempValue, setTempValue] = useState('');

            const initialNewProject = { 
                name: '', client: '', estHours: '', estIncome: '', cost: '', 
                projectDate: new Date().toISOString().split('T')[0], deadline: '', notes: '' 
            };
            const [newProject, setNewProject] = useState(initialNewProject);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    if (u) { setUser(u); setIsLoading(false); } 
                    else { auth.signInAnonymously().catch(() => setIsLoading(false)); }
                });
                const clockInterval = setInterval(() => setNow(new Date()), 1000);
                return () => { unsubscribe(); clearInterval(clockInterval); };
            }, []);

            useEffect(() => {
                if (!user) return;
                const storageUid = syncKey ? `shared_${syncKey}` : user.uid;
                const userPath = `artifacts/${appId}/users/${storageUid}`;
                
                const unsubP = db.collection(`${userPath}/projects`).onSnapshot(snap => setProjects(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubL = db.collection(`${userPath}/logs`).onSnapshot(snap => setLogs(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubS = db.collection(`${userPath}/activeSession`).doc('current').onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        setActiveSession(data);
                        if (data.isRunning) {
                            setActiveProjectId(data.projectId);
                            setActivePhase(data.phase);
                            setSessionNote(data.note || '');
                            if (data.startTimecode) setStartTimecode(data.startTimecode);
                        }
                        if (!data.isRunning && data.pausedAt && (Date.now() - data.pausedAt > 600000)) { 
                            finalizeAuto(data, storageUid); 
                        }
                    } else { setActiveSession(null); }
                });
                return () => { unsubP(); unsubL(); unsubS(); };
            }, [user, syncKey]);

            // 自動預填上一次結束的 Timecode（同專案、同階段才自動帶入）
            useEffect(() => {
                if (activeSession?.isRunning) return;
                if (!activeProjectId || !activePhase || !logs.length) {
                    setStartTimecode('');
                    return;
                }
                const matchingLogs = logs
                    .filter(l => l.projectId === activeProjectId && l.phase === activePhase && l.videoProgress?.endTimecode)
                    .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                if (matchingLogs.length > 0 && matchingLogs[0].videoProgress?.endTimecode) {
                    setStartTimecode(matchingLogs[0].videoProgress.endTimecode);
                } else {
                    setStartTimecode('');
                }
            }, [activeProjectId, activePhase, logs, activeSession?.isRunning]);

            useEffect(() => {
                const itv = setInterval(() => {
                    let currentSec = 0;
                    if (activeSession && activeSession.isRunning) {
                        currentSec = activeSession.baseTime + Math.floor((Date.now() - activeSession.startTime) / 1000);
                    } else { currentSec = activeSession?.baseTime || 0; }
                    setDisplaySeconds(currentSec);
                    if (currentSec > 0 && currentSec % 3000 === 0 && lastAlertSec.current !== currentSec) {
                        lastAlertSec.current = currentSec;
                        setShowBreakAlert(true);
                    }
                }, 1000);
                return () => clearInterval(itv);
            }, [activeSession]);

            const finalizeAuto = async (data, storageUid) => {
                if (data.baseTime <= 0) { await db.collection(`artifacts/${appId}/users/${storageUid}/activeSession`).doc('current').delete(); return; }
                await db.collection(`artifacts/${appId}/users/${storageUid}/logs`).add({ 
                    projectId: data.projectId, phase: data.phase, note: (data.note || "") + " (自動結算)", 
                    seconds: data.baseTime, date: new Date().toISOString(), timestamp: Date.now(),
                    displayStartTime: new Date(data.sessionStartTimeStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    displayEndTime: new Date(data.pausedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    videoProgress: {
                        startTimecode: data.startTimecode || "",
                        endTimecode: "",
                        completedSeconds: 0,
                        minutesPerFinishedMinute: null,
                        finishedSecondsPerWorkHour: null
                    }
                });
                await db.collection(`artifacts/${appId}/users/${storageUid}/activeSession`).doc('current').delete();
                setDisplaySeconds(0);
            };

            const startTimer = async () => { 
                if (!activeProjectId) { alert("請先選擇專案！"); return; } 
                if (!audioCtx.current) audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
                const storageUid = syncKey ? `shared_${syncKey}` : user.uid;
                await db.collection(`artifacts/${appId}/users/${storageUid}/activeSession`).doc('current').set({
                    projectId: activeProjectId, phase: activePhase, isRunning: true,
                    startTime: Date.now(), baseTime: displaySeconds, note: sessionNote,
                    startTimecode: startTimecode.trim(),
                    sessionStartTimeStr: activeSession?.sessionStartTimeStr || new Date().toISOString()
                });
            };

            const pauseTimer = async () => {
                if (!activeSession) return;
                const storageUid = syncKey ? `shared_${syncKey}` : user.uid;
                await db.collection(`artifacts/${appId}/users/${storageUid}/activeSession`).doc('current').update({
                    isRunning: false, baseTime: displaySeconds, pausedAt: Date.now()
                });
            };

            // 儲存 session 的核心函式
            const commitSession = async (videoProgressData) => {
                if (displaySeconds === 0 || !activeSession) return;
                const storageUid = syncKey ? `shared_${syncKey}` : user.uid;
                const targetProject = projects.find(p => p.id === activeSession.projectId);
                const phaseName = PHASES.find(ph => ph.id === activeSession.phase)?.name || '未分類';
                
                const finalSeconds = Number(displaySeconds) || 0;
                const totalMinutesNum = Math.floor(finalSeconds / 60);
                const hrs = Math.floor(finalSeconds / 3600);
                const remainingMins = Math.floor((finalSeconds % 3600) / 60);
                const finalHoursDecimal = parseFloat((finalSeconds / 3600).toFixed(2));
                const durationTextStr = hrs > 0 ? `${hrs}h ${remainingMins}m` : `${remainingMins}m`;

                const cleanProgress = videoProgressData || {
                    startTimecode: "",
                    endTimecode: "",
                    completedSeconds: 0,
                    minutesPerFinishedMinute: null,
                    finishedSecondsPerWorkHour: null
                };

                try { 
                    // 1. 本地 Firebase 存檔 (包含完整的 videoProgress)
                    await db.collection(`artifacts/${appId}/users/${storageUid}/logs`).add({ 
                        projectId: activeSession.projectId, 
                        phase: activeSession.phase, 
                        note: sessionNote, 
                        seconds: finalSeconds, 
                        date: new Date().toISOString(), 
                        timestamp: Date.now(), 
                        displayStartTime: new Date(activeSession.sessionStartTimeStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), 
                        displayEndTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        videoProgress: cleanProgress
                    }); 
                    
                    // 2. 發送給 Notion Webhook
                    if (notionUrl && notionUrl.startsWith('http')) {
                        const payload = { 
                            project: String(targetProject?.name || '未知專案'), 
                            client: String(targetProject?.client || '未知客戶'), 
                            phase: String(phaseName), 
                            hours: Number(finalHoursDecimal), 
                            total_minutes: Number(totalMinutesNum),
                            duration_text: String(durationTextStr),
                            note: String(sessionNote || ""), 
                            date: new Date().toISOString().split('T')[0],
                            start_timecode: cleanProgress.startTimecode || "",
                            end_timecode: cleanProgress.endTimecode || "",
                            completed_seconds: cleanProgress.completedSeconds || 0
                        };

                        fetch(notionUrl, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        }).catch(e => console.error("Notion Sync Error:", e));
                    }

                    await db.collection(`artifacts/${appId}/users/${storageUid}/activeSession`).doc('current').delete();
                    setDisplaySeconds(0); 
                    setSessionNote('');
                    setShowEndTcModal(false);
                    setEndTimecode('');
                    setTcWarning('');
                } catch (err) { alert("存檔失敗: " + err.message); }
            };

            // 點擊「結束並存檔」時的進入點
            const stopTimer = () => {
                if (displaySeconds === 0 || !activeSession) return;
                // 如果開始時有填寫開始 Timecode，彈窗提示輸入結束 Timecode
                if (activeSession.startTimecode && activeSession.startTimecode.trim() !== '') {
                    setEndTimecode('');
                    setTcWarning('');
                    setShowEndTcModal(true);
                } else {
                    // 若無填寫開始 Timecode，直接儲存不打擾
                    commitSession(null);
                }
            };

            // 確認 Timecode 並存檔
            const handleConfirmProgressAndSave = () => {
                const startSec = parseTimecodeToSeconds(activeSession.startTimecode);
                const endSec = parseTimecodeToSeconds(endTimecode);

                if (endSec === null) {
                    setTcWarning('請輸入有效的 Timecode 格式（如 02:05 或 01:10:30）');
                    return;
                }

                if (endSec < startSec) {
                    setTcWarning('結束 Timecode 小於開始 Timecode，請確認是否輸入錯誤。');
                    return;
                }

                const diffSec = endSec - startSec;
                const workMinutes = displaySeconds / 60;
                let minutesPerFinishedMinute = null;
                let finishedSecondsPerWorkHour = null;

                if (diffSec > 0 && workMinutes > 0) {
                    // 公式：實際工作分鐘 ÷（完成秒數 ÷ 60）
                    minutesPerFinishedMinute = Number((workMinutes / (diffSec / 60)).toFixed(2));
                    // 公式：完成秒數 ÷（工作分鐘 ÷ 60）
                    finishedSecondsPerWorkHour = Number((diffSec / (workMinutes / 60)).toFixed(2));
                }

                const videoProgress = {
                    startTimecode: activeSession.startTimecode.trim(),
                    endTimecode: endTimecode.trim(),
                    completedSeconds: diffSec,
                    minutesPerFinishedMinute: minutesPerFinishedMinute,
                    finishedSecondsPerWorkHour: finishedSecondsPerWorkHour
                };

                commitSession(videoProgress);
            };

            const updateProjectData = async (id, field, value) => {
                const storageUid = syncKey ? `shared_${syncKey}` : user.uid;
                await db.collection(`artifacts/${appId}/users/${storageUid}/projects`).doc(id).update({ [field]: value });
                setEditingIncomeId(null); setEditingHoursId(null); setEditingDeadlineId(null);
            };

            const addProject = async () => {
                if (!newProject.name || !newProject.client) { alert("標題與業主為必填！"); return; }
                setIsAdding(true);
                try {
                    const storageUid = syncKey ? `shared_${syncKey}` : user.uid;
                    await db.collection(`artifacts/${appId}/users/${storageUid}/projects`).add({
                        ...newProject, estHours: parseFloat(newProject.estHours) || 0,
                        estIncome: parseFloat(newProject.estIncome) || 0, cost: parseFloat(newProject.cost) || 0,
                        createdAt: new Date().toISOString()
                    });
                    setNewProject(initialNewProject);
                    alert("計畫建立成功！");
                } catch (err) { alert("建立失敗: " + err.code); }
                finally { setIsAdding(false); }
            };

            // === 匯出輔助函式 ===
            const downloadBlobFile = (content, fileName, mimeType) => {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            // 1. 匯出給 ChatGPT 分析 (JSON)
            const handleExportChatGPT = () => {
                const todayStr = new Date().toISOString().split('T')[0];
                const projectMap = {};
                projects.forEach(p => { projectMap[p.id] = p; });

                let totalWorkSeconds = 0;
                let sessionsWithProgress = 0;
                let totalCompletedSeconds = 0;
                let totalWorkMinutesForProgressSessions = 0;

                const dailyMap = {};
                const projectSummaryMap = {};

                const sessionList = logs.map(log => {
                    const sec = Number(log.seconds) || 0;
                    const mins = Math.round(sec / 60);
                    const p = projectMap[log.projectId] || {};
                    const projectName = p.name || '未分類專案';
                    const phaseObj = PHASES.find(ph => ph.id === log.phase);
                    const taskTypeName = phaseObj ? phaseObj.name : (log.phase || '未分類');
                    const logDate = (log.date || '').split('T')[0] || todayStr;

                    totalWorkSeconds += sec;

                    // 每日統計
                    if (!dailyMap[logDate]) {
                        dailyMap[logDate] = { date: logDate, totalWorkMinutes: 0, totalWorkHours: 0, sessionCount: 0 };
                    }
                    dailyMap[logDate].totalWorkMinutes += mins;
                    dailyMap[logDate].sessionCount += 1;

                    // 專案統計
                    if (!projectSummaryMap[projectName]) {
                        projectSummaryMap[projectName] = { projectName, totalWorkMinutes: 0, totalWorkHours: 0, sessionCount: 0 };
                    }
                    projectSummaryMap[projectName].totalWorkMinutes += mins;
                    projectSummaryMap[projectName].sessionCount += 1;

                    // 容錯提取 videoProgress
                    const vp = log.videoProgress || {
                        startTimecode: "",
                        endTimecode: "",
                        completedSeconds: 0,
                        minutesPerFinishedMinute: null,
                        finishedSecondsPerWorkHour: null
                    };

                    if (vp.completedSeconds > 0) {
                        sessionsWithProgress += 1;
                        totalCompletedSeconds += vp.completedSeconds;
                        totalWorkMinutesForProgressSessions += mins;
                    }

                    return {
                        id: log.id || '',
                        date: log.date || '',
                        projectName: projectName,
                        taskType: taskTypeName,
                        startTime: log.displayStartTime || '',
                        endTime: log.displayEndTime || '',
                        durationMinutes: mins,
                        durationSeconds: sec,
                        videoProgress: {
                            startTimecode: vp.startTimecode || '',
                            endTimecode: vp.endTimecode || '',
                            completedSeconds: vp.completedSeconds || 0,
                            minutesPerFinishedMinute: vp.minutesPerFinishedMinute || null,
                            finishedSecondsPerWorkHour: vp.finishedSecondsPerWorkHour || null
                        },
                        notes: log.note || ''
                    };
                });

                const dailySummary = Object.values(dailyMap).map(d => ({
                    ...d,
                    totalWorkHours: Number((d.totalWorkMinutes / 60).toFixed(2))
                })).sort((a, b) => b.date.localeCompare(a.date));

                const projectSummary = Object.values(projectSummaryMap).map(p => ({
                    ...p,
                    totalWorkHours: Number((p.totalWorkMinutes / 60).toFixed(2))
                })).sort((a, b) => b.totalWorkMinutes - a.totalWorkMinutes);

                // 加權平均效率計算（總工作分鐘 ÷ (總完成秒數 / 60)）
                let averageMinutesPerFinishedMinute = null;
                let averageFinishedSecondsPerWorkHour = null;
                if (totalCompletedSeconds > 0 && totalWorkMinutesForProgressSessions > 0) {
                    averageMinutesPerFinishedMinute = Number((totalWorkMinutesForProgressSessions / (totalCompletedSeconds / 60)).toFixed(2));
                    averageFinishedSecondsPerWorkHour = Number((totalCompletedSeconds / (totalWorkMinutesForProgressSessions / 60)).toFixed(2));
                }

                const exportPayload = {
                    exportInfo: {
                        exportDate: todayStr,
                        source: "my-yt-tracker",
                        version: "1.0"
                    },
                    summary: {
                        totalSessions: sessionList.length,
                        totalWorkMinutes: Math.round(totalWorkSeconds / 60),
                        totalWorkHours: Number((totalWorkSeconds / 3600).toFixed(2)),
                        editingEfficiency: {
                            sessionsWithProgress: sessionsWithProgress,
                            totalCompletedSeconds: totalCompletedSeconds,
                            totalWorkMinutesForProgressSessions: totalWorkMinutesForProgressSessions,
                            averageMinutesPerFinishedMinute: averageMinutesPerFinishedMinute,
                            averageFinishedSecondsPerWorkHour: averageFinishedSecondsPerWorkHour
                        },
                        dailySummary: dailySummary,
                        projectSummary: projectSummary
                    },
                    sessions: sessionList,
                    rawData: {
                        projects: projects,
                        logs: logs
                    }
                };

                const fileName = `chatgpt-work-tracker-${todayStr}.json`;
                downloadBlobFile(JSON.stringify(exportPayload, null, 2), fileName, 'application/json;charset=utf-8;');
            };

            // 2. 匯出 CSV (UTF-8 帶 BOM)
            const handleExportCSV = () => {
                const todayStr = new Date().toISOString().split('T')[0];
                const projectMap = {};
                projects.forEach(p => { projectMap[p.id] = p; });

                const headers = [
                    'date',
                    'projectName',
                    'taskType',
                    'startTime',
                    'endTime',
                    'durationMinutes',
                    'startTimecode',
                    'endTimecode',
                    'completedSeconds',
                    'notes'
                ];

                const escapeCSV = (field) => {
                    if (field === null || field === undefined) return '""';
                    const text = String(field).replace(/"/g, '""');
                    return `"${text}"`;
                };

                const rows = logs.map(log => {
                    const sec = Number(log.seconds) || 0;
                    const mins = Math.round(sec / 60);
                    const p = projectMap[log.projectId] || {};
                    const phaseObj = PHASES.find(ph => ph.id === log.phase);
                    const taskTypeName = phaseObj ? phaseObj.name : (log.phase || '');
                    const logDate = (log.date || '').split('T')[0] || todayStr;
                    const vp = log.videoProgress || {};

                    return [
                        escapeCSV(logDate),
                        escapeCSV(p.name || '未分類專案'),
                        escapeCSV(taskTypeName),
                        escapeCSV(log.displayStartTime || ''),
                        escapeCSV(log.displayEndTime || ''),
                        escapeCSV(mins),
                        escapeCSV(vp.startTimecode || ''),
                        escapeCSV(vp.endTimecode || ''),
                        escapeCSV(vp.completedSeconds || 0),
                        escapeCSV(log.note || '')
                    ].join(',');
                });

                const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
                const fileName = `work-tracker-${todayStr}.csv`;
                downloadBlobFile(csvContent, fileName, 'text/csv;charset=utf-8;');
            };

            const todayHours = useMemo(() => {
                const todayStr = new Date().toISOString().split('T')[0];
                const seconds = logs
                    .filter(l => l.date && l.date.startsWith(todayStr))
                    .reduce((sum, log) => sum + (log.seconds || 0), 0);
                return (seconds / 3600).toFixed(1);
            }, [logs]);

            const stats = useMemo(() => {
                if (!projects.length) return [];
                const today = new Date(); today.setHours(0,0,0,0);
                
                return projects.map(p => {
                    const pLogs = logs.filter(l => l.projectId === p.id);
                    const actualSeconds = pLogs.reduce((a, c) => a + (c.seconds || 0), 0);
                    const actualHours = actualSeconds / 3600;
                    const netIncome = (p.estIncome || 0) - (p.cost || 0);
                    const rawRate = actualHours > 0 ? netIncome / actualHours : 0;
                    const rate = Math.min(rawRate, p.estIncome || 0);
                    const efficiency = (actualHours / (p.estHours || 1)) * 100;
                    const comment = efficiency > 120 ? "⚠️ 嚴重超時" : efficiency > 105 ? "🧐 稍微拖慢" : efficiency < 85 ? "✨ 效率極佳" : "✅ 穩定";
                    
                    const phaseData = PHASES.map(ph => {
                        const phSec = pLogs.filter(l => l.phase === ph.id).reduce((a, c) => a + (c.seconds || 0), 0);
                        return { ...ph, percent: actualSeconds > 0 ? (phSec / actualSeconds) * 100 : 0 };
                    });

                    const deadlineDate = p.deadline ? new Date(p.deadline) : null;
                    const isClosed = deadlineDate && deadlineDate < today;

                    return { 
                        ...p, actualHours, actualHourlyRate: rate, efficiency, phaseData, 
                        daysLeft: p.deadline ? Math.ceil((new Date(p.deadline) - new Date()) / 86400000) : null, 
                        netIncome, recentWork: [...pLogs].sort((a,b) => b.timestamp - a.timestamp).slice(0, 3), 
                        comment, isClosed 
                    };
                }).sort((a, b) => new Date(b.projectDate) - new Date(a.projectDate));
            }, [logs, projects]);

            const activeProjectsDropdown = useMemo(() => {
                return stats.filter(p => !p.isClosed).sort((a, b) => (a.client || "").localeCompare(b.client || "", 'zh-Hant'));
            }, [stats]);

            const archivedGroups = useMemo(() => {
                const closed = stats.filter(p => p.isClosed);
                const groups = {};
                closed.forEach(p => {
                    const date = new Date(p.projectDate);
                    const monthKey = `${date.getFullYear()} / ${String(date.getMonth() + 1).padStart(2, '0')}`;
                    if (!groups[monthKey]) groups[monthKey] = [];
                    groups[monthKey].push(p);
                });
                return groups;
            }, [stats]);

            const currentPhaseColor = useMemo(() => PHASES.find(p => p.id === activePhase)?.color || '#3b82f6', [activePhase]);

            if (isLoading && !user) return <div className="flex items-center justify-center h-screen text-slate-500 font-mono animate-pulse uppercase tracking-[0.2em]">Connecting...</div>;

            const renderProjectCard = (p) => (
                <div key={p.id} className="mobile-card p-6 space-y-5 shadow-2xl border-white/5 border mb-4">
                    <div className="flex justify-between items-start">
                        <div className="space-y-2 max-w-[65%]">
                            <div className="flex flex-wrap items-center gap-2">
                                <span className="text-[9px] bg-blue-500/10 text-blue-400 font-bold px-2 py-0.5 rounded-lg border border-blue-500/20">{p.client}</span>
                                <span className="text-[9px] text-slate-600 font-mono">{p.projectDate?.substring(5).replace('-', '/')}</span>
                            </div>
                            <h3 className="text-lg font-bold text-white leading-tight tracking-tight">{p.name}</h3>
                        </div>
                        <div className="text-right flex flex-col items-end">
                            <div className="text-xl font-bold text-green-400 font-mono tracking-tighter">${Math.round(p.actualHourlyRate)}/h</div>
                            <div className="flex flex-col items-end gap-0.5 mt-1">
                                {editingIncomeId === p.id ? (
                                    <div className="flex items-center gap-1 bg-black/50 p-1 rounded-lg border border-blue-500/50"><input type="number" autoFocus className="w-16 bg-transparent text-[10px] text-white outline-none font-bold" value={tempValue} onChange={e => setTempValue(e.target.value)} onBlur={() => updateProjectData(p.id, 'estIncome', parseFloat(tempValue) || 0)} onKeyDown={e => e.key === 'Enter' && updateProjectData(p.id, 'estIncome', parseFloat(tempValue) || 0)} /><button onClick={() => updateProjectData(p.id, 'estIncome', parseFloat(tempValue) || 0)} className="text-green-500"><Icon name="check" size={12}/></button></div>
                                ) : (
                                    <div className="flex items-center gap-1 cursor-pointer hover:opacity-80 group" onClick={() => { setEditingIncomeId(p.id); setTempValue(p.estIncome); }}><span className="text-[9px] text-slate-400 font-bold uppercase">預估收入: ${p.estIncome?.toLocaleString()}</span><Icon name="edit" size={10} className="text-slate-700 group-hover:text-blue-500 transition-colors"/></div>
                                )}
                                <span className="text-[9px] text-slate-600 font-bold uppercase tracking-tighter">淨利: ${p.netIncome?.toLocaleString()}</span>
                            </div>
                        </div>
                    </div>
                    <div className="space-y-4">
                        <div className="space-y-2">
                            <div className="flex justify-between text-[10px] font-bold uppercase">
                                <span className="text-slate-500 flex items-center gap-1 font-mono">投入: {p.actualHours?.toFixed(1)}h / {editingHoursId === p.id ? (<span className="inline-flex items-center gap-1 bg-black/50 px-1 rounded border border-blue-500/50"><input type="number" autoFocus className="w-10 bg-transparent text-white outline-none text-[10px]" value={tempValue} onChange={e => setTempValue(e.target.value)} onBlur={() => updateProjectData(p.id, 'estHours', parseFloat(tempValue) || 0)} onKeyDown={e => e.key === 'Enter' && updateProjectData(p.id, 'estHours', parseFloat(tempValue) || 0)} /><button onClick={() => updateProjectData(p.id, 'estHours', parseFloat(tempValue) || 0)} className="text-green-500"><Icon name="check" size={10}/></button></span>) : (<span className="cursor-pointer hover:text-blue-400 inline-flex items-center gap-1 group" onClick={() => { setEditingHoursId(p.id); setTempValue(p.estHours); }}>預計: {p.estHours}h <Icon name="edit" size={8} className="text-slate-700 group-hover:text-blue-500"/></span>)}</span>
                                <span className={p.efficiency > 100 ? 'text-red-400' : 'text-blue-400'}>{p.efficiency?.toFixed(0)}%</span>
                            </div>
                            <div className="h-2.5 bg-black rounded-full overflow-hidden flex border border-white/5 shadow-inner">
                                {p.phaseData.map(ph => ph.percent > 0 && (<div key={ph.id} style={{ width: `${ph.percent}%`, backgroundColor: ph.color }} className="h-full border-r border-black/20 last:border-0" />))}
                            </div>
                            <div className="grid grid-cols-2 gap-2 mt-4">
                                {p.phaseData.filter(ph => ph.percent > 0).map(ph => (
                                    <div key={ph.id} className="bg-black/20 p-2.5 rounded-xl flex items-center justify-between border border-white/5 shadow-sm">
                                        <div className="flex items-center gap-2 overflow-hidden"><div className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{ backgroundColor: ph.color }} /><span className="text-[10px] text-slate-400 truncate font-semibold">{ph.name}</span></div>
                                        <span className="text-[10px] font-mono font-bold" style={{ color: ph.color }}>{ph.percent.toFixed(0)}%</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* 近期工作進度紀錄 (含 Timecode 與效率指標) */}
                        {p.recentWork && p.recentWork.length > 0 && (
                            <div className="space-y-1.5 pt-2 border-t border-white/5">
                                <div className="text-[9px] text-slate-500 font-bold uppercase tracking-wider">近期工作進度</div>
                                {p.recentWork.map(rw => {
                                    const vp = rw.videoProgress;
                                    const hasProgress = vp && vp.completedSeconds > 0;
                                    return (
                                        <div key={rw.id || rw.timestamp} className="text-[10px] text-slate-400 bg-black/30 p-2 rounded-xl flex flex-wrap items-center justify-between gap-1 border border-white/5">
                                            <div className="flex items-center gap-1.5 truncate">
                                                <span className="text-slate-500 font-mono">{rw.date?.substring(5, 10).replace('-', '/')}</span>
                                                <span className="font-semibold text-slate-300">{PHASES.find(ph => ph.id === rw.phase)?.name || rw.phase}</span>
                                                {hasProgress && (
                                                    <span className="text-blue-400 font-mono">
                                                        {vp.startTimecode} → {vp.endTimecode} (+{vp.completedSeconds}s)
                                                    </span>
                                                )}
                                                {rw.note && <span className="text-slate-500 italic truncate max-w-[120px]">({rw.note})</span>}
                                            </div>
                                            <div className="font-mono text-slate-400 flex items-center gap-1">
                                                <span>{Math.round((rw.seconds || 0) / 60)}m</span>
                                                {hasProgress && vp.minutesPerFinishedMinute && (
                                                    <span className="text-emerald-400 font-bold">
                                                        ({(vp.minutesPerFinishedMinute / 60).toFixed(1)}h/成片分)
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        <div className="flex items-center gap-4 bg-black/40 p-4 rounded-2xl border border-white/5 shadow-inner"><Icon name="alert-circle" size={18} className={p.efficiency > 105 ? 'text-orange-500' : 'text-blue-500'} /><div className="flex-1 text-xs italic text-slate-400">"{p.comment}"</div></div>
                        <div className="flex justify-between items-center pt-2">
                            <div className="flex-1">
                                {editingDeadlineId === p.id ? (
                                    <input type="date" autoFocus className="bg-black border border-blue-500/50 text-[10px] rounded p-1 text-blue-400 outline-none" value={tempValue} onChange={e => setTempValue(e.target.value)} onBlur={() => updateProjectData(p.id, 'deadline', tempValue)} />
                                ) : (
                                    p.isClosed ? (
                                        <span onClick={() => { setEditingDeadlineId(p.id); setTempValue(p.deadline); }} className="text-[10px] font-bold px-3 py-1.5 rounded-xl bg-slate-800 text-slate-500 flex items-center gap-2 cursor-pointer border border-white/5"><Icon name="archive" size={12} /> 已結案 (截稿: {p.deadline?.substring(5)})</span>
                                    ) : (
                                        p.deadline ? (
                                            <span onClick={() => { setEditingDeadlineId(p.id); setTempValue(p.deadline); }} className={`text-[10px] font-bold px-3 py-1.5 rounded-xl flex items-center gap-2 cursor-pointer hover:opacity-80 transition-all ${p.daysLeft < 3 ? 'bg-red-500/20 text-red-400 animate-pulse' : 'bg-white/5 text-slate-400'}`}><Icon name="calendar" size={12} /> 截稿: {p.deadline.substring(5)} ({p.daysLeft}天) <Icon name="edit" size={8} /></span>
                                        ) : <button onClick={() => { setEditingDeadlineId(p.id); setTempValue(new Date().toISOString().split('T')[0]); }} className="text-[10px] text-slate-600 flex items-center gap-1 font-bold"><Icon name="calendar" size={10} /> 設定截稿日</button>
                                    )
                                )}
                            </div>
                            <button onClick={async () => { if(confirm("確定刪除專案？")) { const storageUid = syncKey ? `shared_${syncKey}` : user.uid; await db.collection(`artifacts/${appId}/users/${storageUid}/projects`).doc(p.id).delete(); } }} className="p-2.5 text-slate-700 hover:text-red-500 transition-all"><Icon name="trash-2" size={18}/></button>
                        </div>
                    </div>
                </div>
            );

            // 即時計算彈窗內的預覽數值
            const previewMetrics = useMemo(() => {
                if (!activeSession?.startTimecode || !endTimecode) return null;
                const s = parseTimecodeToSeconds(activeSession.startTimecode);
                const e = parseTimecodeToSeconds(endTimecode);
                if (s === null || e === null || e < s) return null;
                const diff = e - s;
                const workMinutes = displaySeconds / 60;
                const minsPerFinMin = diff > 0 && workMinutes > 0 ? (workMinutes / (diff / 60)).toFixed(1) : null;
                const finSecPerHour = diff > 0 && workMinutes > 0 ? (diff / (workMinutes / 60)).toFixed(1) : null;
                return { diff, minsPerFinMin, finSecPerHour };
            }, [activeSession?.startTimecode, endTimecode, displaySeconds]);

            return (
                <div className="max-w-md mx-auto px-4 py-6 space-y-6 pb-24 relative">
                    
                    {showBreakAlert && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 backdrop-blur-xl p-6">
                            <div className="mobile-card p-8 w-full max-w-xs text-center border-2 border-blue-500 shadow-2xl animate-alert">
                                <Icon name="heart-pulse" size={64} className="text-blue-500 mx-auto mb-6 animate-pulse" />
                                <h2 className="text-2xl font-bold text-white mb-2">該休息囉！</h2>
                                <p className="text-slate-400 text-sm mb-8 leading-relaxed">已連續專注 50 分鐘。為了保護眼睛與肩膀，請起來活動筋骨，遠眺休息。</p>
                                <button onClick={() => setShowBreakAlert(false)} className="w-full py-5 bg-blue-600 text-white rounded-2xl font-bold shadow-xl">收到，去休息</button>
                            </div>
                        </div>
                    )}

                    {/* 結束計時的 Timecode 輸入彈窗 */}
                    {showEndTcModal && (
                        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-6 backdrop-blur-md">
                            <div className="mobile-card p-6 w-full max-w-xs space-y-5 shadow-2xl border border-blue-500/30">
                                <div className="text-center space-y-1">
                                    <h2 className="text-white font-bold text-lg flex items-center justify-center gap-2">
                                        <Icon name="video" size={20} color="#3b82f6" /> 記錄影片進度
                                    </h2>
                                    <p className="text-slate-400 text-xs">
                                        本次開始：<span className="font-mono text-blue-400 font-bold">{activeSession?.startTimecode}</span>
                                    </p>
                                </div>

                                <div className="space-y-2">
                                    <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest block">
                                        目前影片做到哪裡？(結束 Timecode)
                                    </label>
                                    <input 
                                        type="text" 
                                        autoFocus
                                        placeholder="例 02:05 或 01:05:30" 
                                        className="w-full bg-black border border-white/20 p-4 rounded-2xl text-white font-mono text-center text-lg outline-none focus:border-blue-500 shadow-inner"
                                        value={endTimecode} 
                                        onChange={e => { setEndTimecode(e.target.value); setTcWarning(''); }}
                                        onKeyDown={e => e.key === 'Enter' && handleConfirmProgressAndSave()}
                                    />
                                    {tcWarning && (
                                        <div className="text-red-400 text-[11px] leading-tight font-medium bg-red-500/10 p-2.5 rounded-xl border border-red-500/20">
                                            ⚠️ {tcWarning}
                                        </div>
                                    )}
                                    {previewMetrics && (
                                        <div className="bg-blue-500/10 p-3 rounded-xl border border-blue-500/20 space-y-1 text-[11px]">
                                            <div className="text-blue-300 flex justify-between">
                                                <span>實際推進成片：</span>
                                                <span className="font-mono font-bold text-white">+{previewMetrics.diff} 秒</span>
                                            </div>
                                            <div className="text-slate-400 flex justify-between">
                                                <span>剪輯耗時比：</span>
                                                <span className="font-mono text-emerald-400 font-bold">{previewMetrics.minsPerFinMin} 分 / 成片分</span>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="space-y-2 pt-1">
                                    <button 
                                        onClick={handleConfirmProgressAndSave} 
                                        className="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-bold btn-active shadow-lg transition-colors"
                                    >
                                        確認並存檔
                                    </button>
                                    <button 
                                        onClick={() => commitSession(null)} 
                                        className="w-full py-2.5 bg-transparent text-slate-400 hover:text-slate-300 text-xs rounded-xl transition-colors"
                                    >
                                        略過這次進度，直接存檔
                                    </button>
                                    <button 
                                        onClick={() => setShowEndTcModal(false)} 
                                        className="w-full py-2 bg-white/5 hover:bg-white/10 text-slate-500 hover:text-slate-400 text-xs rounded-xl"
                                    >
                                        返回繼續計時
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="flex justify-between items-center border-b border-white/5 pb-4">
                        <div className="flex flex-col"><h1 className="text-xl font-bold text-white flex items-center gap-2"><Icon name="trending-up" color="#3b82f6" size={24} /> 肝片大師 Pro</h1><span className="text-[10px] font-mono text-slate-500 uppercase">{now.toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', weekday: 'short' })} {now.toLocaleTimeString()}</span></div>
                        <button onClick={() => setShowSyncModal(true)} className="p-2.5 bg-white/5 rounded-2xl text-slate-400 btn-active"><Icon name="settings" size={22} /></button>
                    </header>

                    {showSyncModal && (
                        <div className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-6 backdrop-blur-md">
                            <div className="mobile-card p-7 w-full max-w-xs space-y-5 shadow-2xl">
                                <h2 className="text-white font-bold flex items-center gap-2 text-lg justify-center"><Icon name="settings" size={20} color="#3b82f6"/> 系統設定</h2>
                                <div className="space-y-4 pt-2">
                                    <div className="space-y-1.5"><label className="text-[10px] text-slate-500 font-bold uppercase">同步 ID</label><input type="text" className="w-full bg-black border border-white/10 p-4 rounded-2xl text-white outline-none" value={syncKey} onChange={e => setSyncKey(e.target.value)} /></div>
                                    <div className="space-y-1.5"><label className="text-[10px] text-blue-500 font-bold uppercase">Notion Webhook</label><input type="text" placeholder="https://..." className="w-full bg-black border border-blue-900/30 p-4 rounded-2xl text-white outline-none" value={notionUrl} onChange={e => setNotionUrl(e.target.value)} /></div>
                                </div>
                                <div className="flex gap-2 pt-2"><button onClick={() => { localStorage.setItem('yt_editor_sync_id', syncKey); localStorage.setItem('notion_webhook_url', notionUrl); window.location.reload(); }} className="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-bold">儲存重啟</button><button onClick={() => setShowSyncModal(false)} className="flex-1 py-4 bg-white/10 text-slate-300 rounded-2xl">關閉</button></div>
                            </div>
                        </div>
                    )}

                    <div className="mobile-card p-4 sm:p-6 space-y-6 shadow-2xl border-white/5 border-2">
                        <div className="space-y-4">
                            <div className="space-y-1.5 px-1"><label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">選擇專案 (依業主排序)</label><select className="w-full bg-black border border-white/10 rounded-2xl p-4 text-white outline-none focus:ring-2 ring-blue-500 appearance-none shadow-inner" value={activeProjectId} onChange={e => setActiveProjectId(e.target.value)} disabled={activeSession?.isRunning}><option value="">-- 點選專案 --</option>{activeProjectsDropdown.map(p => <option key={p.id} value={p.id}>{p.client} | {p.name}</option>)}</select></div>
                            <div className="space-y-1.5 px-1"><label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">工作環節</label><div className="grid grid-cols-2 gap-2">{PHASES.map(ph => <button key={ph.id} onClick={() => setActivePhase(ph.id)} disabled={activeSession?.isRunning} style={activePhase === ph.id ? { borderColor: ph.color, backgroundColor: `${ph.color}20`, color: ph.color } : {}} className={`text-[11px] py-3.5 rounded-2xl border border-white/5 bg-white/5 text-slate-500 btn-active ${activePhase === ph.id ? 'font-bold' : ''}`}>{ph.name}</button>)}</div></div>
                            
                            {/* 開始 Timecode 欄位（選填） */}
                            <div className="space-y-1.5 px-1">
                                <div className="flex justify-between items-center">
                                    <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">開始 Timecode (影片目前進度)</label>
                                    <span className="text-[9px] text-slate-600 font-mono">選填，如 01:20</span>
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="00:00 (可不填，依專案自動帶入)" 
                                    className="w-full bg-black border border-white/10 rounded-2xl p-3.5 text-white font-mono text-sm outline-none focus:ring-2 ring-blue-500 shadow-inner"
                                    value={startTimecode} 
                                    onChange={e => setStartTimecode(e.target.value)} 
                                    disabled={activeSession?.isRunning} 
                                />
                            </div>
                        </div>

                        <div className="text-center space-y-5 py-8 px-2 bg-black/40 rounded-[36px] border border-white/5 shadow-inner">
                            <div className={`timer-font text-5xl sm:text-6xl font-bold timer-glow transition-all duration-300 ${activeSession?.isRunning ? 'scale-105' : 'opacity-20'}`} style={{ color: activeSession?.isRunning ? currentPhaseColor : '#e2e8f0' }}>{formatTime(displaySeconds)}</div>
                            <div className="px-3 space-y-3">
                                {(!activeSession || !activeSession.isRunning) ? <button onClick={startTimer} style={{ backgroundColor: activeProjectId ? currentPhaseColor : '#334155' }} className="w-full py-5 text-white rounded-[24px] font-bold text-lg sm:text-xl shadow-xl flex items-center justify-center gap-3 btn-active"><Icon name="play" fill="currentColor" size={24} /> 開始計時</button>
                                : <button onClick={pauseTimer} className="w-full py-5 bg-orange-600/90 text-white rounded-[24px] font-bold text-lg sm:text-xl btn-active flex items-center justify-center gap-3"><Icon name="pause" fill="currentColor" size={24} /> 休息一下</button>}
                                {displaySeconds > 0 && <button onClick={stopTimer} className="w-full py-2 text-red-500 text-[11px] font-bold uppercase tracking-[0.3em] opacity-80 hover:opacity-100 transition-opacity">結束並存檔</button>}
                            </div>
                        </div>
                        <div className="flex items-center gap-3 bg-black/30 p-4 rounded-2xl border border-white/5 shadow-inner mx-1"><Icon name="message-square" size={16} className="text-slate-600" /><input type="text" placeholder="本次筆記..." className="bg-transparent text-xs text-slate-300 outline-none w-full" value={sessionNote} onChange={e => setSessionNote(e.target.value)} /></div>
                    </div>

                    {/* 數據小卡片 */}
                    <div className="grid grid-cols-3 gap-2">
                        <div className="mobile-card p-3 flex flex-col justify-center items-center border-white/5 shadow-lg"><span className="text-[8px] text-slate-500 font-bold mb-1 uppercase">本日肝片</span><span className="text-lg font-bold text-orange-400 font-mono">{todayHours}h</span></div>
                        <div className="mobile-card p-3 flex flex-col justify-center items-center border-white/5 shadow-lg"><span className="text-[8px] text-slate-500 font-bold mb-1 uppercase">平均時薪</span><span className="text-lg font-bold text-green-400 font-mono">${stats.length > 0 ? Math.round(stats.reduce((a, b) => a + (b.actualHourlyRate || 0), 0) / stats.length) : 0}</span></div>
                        <div className="mobile-card p-3 flex flex-col justify-center items-center border-white/5 shadow-lg"><span className="text-[8px] text-slate-500 font-bold mb-1 uppercase">總淨利</span><span className="text-lg font-bold text-blue-400 font-mono">${stats.reduce((a, b) => a + (b.netIncome || 0), 0).toLocaleString()}</span></div>
                    </div>

                    {/* 匯出功能按鈕區 */}
                    <div className="mobile-card p-4 flex gap-3 shadow-lg border-white/5">
                        <button onClick={handleExportChatGPT} className="flex-1 py-3.5 px-3 bg-emerald-600/90 hover:bg-emerald-600 text-white rounded-2xl font-bold text-xs flex items-center justify-center gap-1.5 btn-active shadow-md transition-colors">
                            <span>📊 匯出給 ChatGPT</span>
                        </button>
                        <button onClick={handleExportCSV} className="flex-1 py-3.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-2xl font-bold text-xs flex items-center justify-center gap-1.5 btn-active border border-white/5 transition-colors">
                            <span>📥 匯出 CSV</span>
                        </button>
                    </div>

                    <div className="space-y-4">
                        <h2 className="text-sm font-bold text-slate-500 uppercase tracking-widest px-1 flex items-center gap-2"><Icon name="target" size={14} color="#ec4899" /> 進行中專案分析</h2>
                        {stats.filter(p => !p.isClosed).length === 0 ? (
                            <div className="mobile-card p-10 text-center text-slate-600 text-xs font-bold uppercase tracking-[0.3em]">目前沒有執行中的專案</div>
                        ) : (
                            stats.filter(p => !p.isClosed).map(p => renderProjectCard(p))
                        )}

                        <div className="pt-6 space-y-4">
                            <h2 className="text-sm font-bold text-slate-700 uppercase tracking-widest px-1 flex items-center gap-2"><Icon name="archive" size={14} color="#64748b" /> 歷程存檔 (已結案)</h2>
                            {Object.keys(archivedGroups).length === 0 ? (
                                <div className="text-[10px] text-slate-800 text-center uppercase py-4 font-bold tracking-widest opacity-50">尚無結案數據</div>
                            ) : (
                                Object.keys(archivedGroups).sort((a,b) => b.localeCompare(a)).map(month => (
                                    <div key={month} className="space-y-2">
                                        <button onClick={() => setExpandedMonth(expandedMonth === month ? null : month)} className="w-full flex justify-between items-center bg-white/5 p-4 rounded-2xl border border-white/5 active:bg-white/10 transition-all">
                                            <span className="text-xs font-bold text-slate-400 flex items-center gap-2"><Icon name="calendar" size={12} /> {month}</span>
                                            <div className="flex items-center gap-3"><span className="text-[10px] bg-slate-800 text-slate-500 px-2 py-0.5 rounded-lg">{archivedGroups[month].length} 專案</span><Icon name={expandedMonth === month ? "chevron-up" : "chevron-down"} size={14} color="#475569" /></div>
                                        </button>
                                        {expandedMonth === month && (<div className="space-y-3">{archivedGroups[month].map(p => renderProjectCard(p))}</div>)}
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    <div className="mobile-card p-7 space-y-6 shadow-2xl border-white/5 mt-12">
                        <h3 className="text-lg font-bold text-white flex items-center gap-3"><Icon name="plus" size={20} color="#3b82f6"/> 新增剪輯計畫</h3>
                        <div className="space-y-5">
                            <div className="space-y-1.5"><label className="text-[10px] text-slate-500 font-bold uppercase px-1 tracking-widest">影片標題</label><input type="text" placeholder="影片名稱" className="w-full bg-black border border-white/10 p-4 rounded-2xl text-white outline-none focus:border-blue-500 shadow-inner" value={newProject.name} onChange={e => setNewProject({...newProject, name: e.target.value})} /></div>
                            <div className="space-y-1.5"><label className="text-[10px] text-slate-500 font-bold uppercase px-1 tracking-widest">業主名稱</label><input type="text" placeholder="客戶名" className="w-full bg-black border border-white/10 p-4 rounded-2xl text-white outline-none focus:border-blue-500 shadow-inner" value={newProject.client} onChange={e => setNewProject({...newProject, client: e.target.value})} /></div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1.5"><label className="text-[10px] text-slate-500 font-bold uppercase px-1 tracking-widest">預估收益</label><input type="number" placeholder="NTD" className="w-full bg-black border border-white/10 p-4 rounded-2xl text-white outline-none shadow-inner" value={newProject.estIncome} onChange={e => setNewProject({...newProject, estIncome: e.target.value})} /></div>
                                <div className="space-y-1.5"><label className="text-[10px] text-slate-500 font-bold uppercase px-1 tracking-widest">額外成本</label><input type="number" placeholder="NTD" className="w-full bg-black border border-white/10 p-4 rounded-2xl text-white outline-none shadow-inner" value={newProject.cost} onChange={e => setNewProject({...newProject, cost: e.target.value})} /></div>
                            </div>
                            <div className="grid grid-cols-2 gap-4"><div className="space-y-1.5"><label className="text-[10px] text-blue-400 font-bold uppercase px-1 tracking-tighter">執行日期</label><input type="date" className="w-full bg-black border border-white/10 p-4 rounded-2xl text-white outline-none shadow-inner" value={newProject.projectDate} onChange={e => setNewProject({...newProject, projectDate: e.target.value})} /></div><div className="space-y-1.5"><label className="text-[10px] text-red-400 font-bold uppercase px-1 tracking-tighter">截稿日期</label><input type="date" className="w-full bg-black border border-blue-900/30 p-4 rounded-2xl text-white outline-none shadow-inner" value={newProject.deadline} onChange={e => setNewProject({...newProject, deadline: e.target.value})} /></div></div>
                            <div className="space-y-1.5"><label className="text-[10px] text-slate-500 font-bold uppercase px-1 tracking-widest">預計總時數 (h)</label><input type="number" placeholder="小時" className="w-full bg-black border border-white/10 p-4 rounded-2xl text-white outline-none shadow-inner" value={newProject.estHours} onChange={e => setNewProject({...newProject, estHours: e.target.value})} /></div>
                            <button onClick={addProject} className="w-full py-5 rounded-[24px] font-bold text-lg shadow-xl btn-active mt-2 bg-blue-600 text-white transition-all">建立計畫</button>
                        </div>
                    </div>
                    <footer className="text-center py-12 opacity-20 text-[9px] uppercase tracking-[0.4em] font-mono">YT Master Logic v7.2 • Automation Ready</footer>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
